name: Deploy React/Vite Site

on:
  push:
    branches:
      - main # Change to master if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: client
        env:
          CI: false # <-- Add this block to ignore code warnings

      - name: Build Application
        run: npm run build
        working-directory: client

      - name: Setup Pages Routing
        uses: actions/configure-pages@v5

      - name: Upload Production Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/build' # Correctly targets your build folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
